name: ⚠️ Server Issue / Racing Event Problem
description: Report an issue with the public Formula Aeronautics server, whitelist, races, or Discord integration.
labels: ["server", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        This template is specifically for issues with the **public server**.
        For modpack bugs (singleplayer or client-side), please use the "Bug Report (Modpack)" template instead.

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What kind of server issue are you reporting?
      options:
        - Whitelist / Discord Link not working
        - Racing timer not starting / not tracking
        - Pit stop mechanic broken
        - Server crash or lag
        - Permission / teleport issues
        - Other server-related problem
    validations:
      required: true

  - type: input
    id: username
    attributes:
      label: Your Minecraft Username
      placeholder: e.g. tokiponaenjoyer
    validations:
      required: true

  - type: input
    id: datetime
    attributes:
      label: Date and Time of Issue
      description: When did this happen? Include your timezone.
      placeholder: e.g. June 18, 2026, 3:00 PM EST
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue in detail.
      placeholder: |
        I joined the server, opted in to the whitelist, but when I tried to /race start, nothing happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server Logs (if available)
      description: If you have access to any server-side logs or client console logs, upload to mclo.gs and paste the link here.
      placeholder: Paste mclo.gs link here.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add any screenshots that help show the issue (e.g., error messages in chat).
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Additional Context
      description: Any other info that might help (e.g., how many players were online, what track you were on).
    validations:
      required: false